<body class="theme-default">

  <!-- Cyberpunk Background & Cursor Glow -->
  <div class="site-bg-layer" id="siteBgLayer"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <!-- Mobile Topbar -->
  <header class="mobile-topbar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="brand-mark" style="width: 32px; height: 32px; font-size: 11px;">XP</div>
      <b style="font-size: 15px; color: #fff;">Progress XP</b>
    </div>
    <button class="btn secondary sm" id="mobileMenuBtn" aria-label="Open menu">
      ☰ Menu
    </button>
  </header>

  <!-- Main App Layout Shell -->
  <div class="app-layout" id="appLayout">
    <!-- Desktop Sidebar Rail & Drawer -->
    <aside class="app-sidebar" id="appSidebar"></aside>

    <!-- Main Dynamic Content Workspace -->
    <main class="main-content" id="appMain" role="main"></main>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav">
    <a href="#" class="mobile-nav-btn active" data-nav="dashboard">
      <i>📊</i>
      <span>Dashboard</span>
    </a>
    <a href="#" class="mobile-nav-btn" data-nav="mission">
      <i>🎯</i>

    </a>
    <a href="#" class="mobile-nav-btn" data-nav="habits">
      <i>⚡</i>
      <span>Habits</span>
    </a>
    <a href="#" class="mobile-nav-btn" data-nav="shop">
      <i>💎</i>
      <span>Shop</span>
    </a>
    <a href="#" class="mobile-nav-btn" data-nav="achievements">
      <i>🏆</i>
      <span>Vault</span>
    </a>
  </nav>

  <!-- Global Footer Credit (As Extracted from Source) -->
  <footer class="app-creator-footer">
    Progress XP • Created by Abdul Cizen Siddiqui • Reverse Engineered with REA & GhidraMCP

  <script src="js/components/nav.js"></script>
